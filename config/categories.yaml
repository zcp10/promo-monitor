    comparar: modelo
    liquidez: media
  gabinete:
    nome: Gabinete
    detectar: [gabinete]
    comparar: modelo
    liquidez: baixa
  notebook:
    nome: Notebook
    detectar: [notebook, macbook, laptop, chromebook]
    excluir: [capa, mochila, suporte, base, cooler para, carregador, fonte para, teclado para, bateria para, pelicula, case]
