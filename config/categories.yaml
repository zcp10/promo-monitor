# ============================================================
#  Catálogo de revenda — categorias e produtos "top" (out/2026)
#
#  comparar: modelo         -> só vale o MESMO modelo (RTX 5060, iPhone 16, G203)
#  comparar: especificacao  -> vale qualquer marca com as mesmas especificações
#                              (SSD NVMe 1TB; monitor 21,5" Full HD)
#  mesma_marca: true        -> no modo especificação, exige também a mesma marca
#  specs                    -> o que precisa bater (ver promo/catalog.py: SPECS)
#  busca                    -> texto curto usado nas lojas; {spec} é preenchido
#  liquidez                 -> alta = sai rápido / media / baixa = demora ou é volumoso
#  detectar / excluir       -> palavras do título (sem acento, minúsculas)
#
#  Fontes da lista: rankings de mais vendidos de Mercado Livre e Shopee 2026
#  (Nuvemshop, Melhor Envio, Duoke, Bagy, Loja Integrada) + o que mais aparece nos
#  grupos de promoção monitorados (hardware, celular, games, áudio, casa).
#  A ordem importa: a primeira categoria que casar vence.
# ============================================================

marcas: [apple, samsung, motorola, xiaomi, redmi, poco, realme, lg, sony, philips, philco, tcl, aoc,
         lenovo, acer, asus, dell, hp, positivo, multilaser, intelbras, tp-link, mercusys, kingston,
         crucial, western digital, wd, sandisk, seagate, adata, xpg, corsair, hyperx, logitech,
         redragon, razer, jbl, edifier, qcy, haylou, anker, baseus, ugreen, amazon, mondial, britania,
         electrolux, oster, arno, walita, wap, black+decker, bosch, makita, dewalt, electrolux,
         midea, gree, elgin, consul, brastemp, nintendo, microsoft, msi, gigabyte, asrock, galax,
         pny, zotac, palit, sapphire, powercolor, rise mode, pichau, mancer, husky, aula, machenike,
         attack shark, fifine, superframe, duex, lg, epson, canon, brother, tapo, imou, ezviz,
         huawei, honor, oppo, vivo, oneplus, google, nothing, tgt, thunderx3, dt3, fox racer, cougar, elsys,
         easysmx, gamesir, 8bitdo, awei, tomate, lenoxx, mchose, dji, gopro, insta360, biostar, cooler master,
         deepcool, lian li, nzxt, thermaltake, montech, gudga, juhor, kootion, envinda, netac, lexar, kingspec,
         teamgroup, patriot, hp, positivo, vaio, ugreen, essager, kz, soundpeats, edifier, havit, onikuma,
         marshall, bose, beats, shokz, britania, cadence, c3tech, elg, vinik, exbom, knup]

categorias:
  # ---------------- Celulares, tablets, relógios (alta) ----------------
  iphone:
    nome: iPhone
    detectar: [iphone]
    excluir: [capa, capinha, pelicula, case, carregador, cabo, suporte, lente, protetor, bateria externa]
    comparar: modelo
    specs: [capacidade]
    liquidez: alta
  smartphone:
    nome: Smartphone
    detectar: [smartphone, celular, galaxy, moto g, motorola edge, redmi note, redmi, poco, realme]
    excluir: [capa, capinha, pelicula, case, carregador, cabo, suporte, galaxy tab, galaxy watch,
              galaxy buds, smartwatch, relogio, band, tablet, redmi pad, fone]
    comparar: modelo
    specs: [capacidade, ram]
    liquidez: alta
  tablet:
    nome: Tablet / iPad
    detectar: [ipad, tablet, galaxy tab, redmi pad, xiaomi pad, tab a9, tab s10]
    excluir: [capa, case, pelicula, teclado para, caneta, suporte, pencil]
    comparar: modelo
    specs: [capacidade]
    liquidez: alta
  smartwatch:
    nome: Smartwatch / pulseira
    detectar: [smartwatch, apple watch, galaxy watch, smart band, mi band, amazfit, relogio inteligente]
    excluir: [pulseira para, pulseira de, pelicula, capa, case, carregador para, suporte]
    comparar: modelo
    liquidez: alta
  kindle:
    nome: Kindle / e-reader
    detectar: [kindle]
    excluir: [capa, case, pelicula, suporte]
    comparar: modelo
    reuso: modelo          # segunda opinião: mesmo modelo, qualquer marca de placa/vendedor
    liquidez: alta

  # ---------------- Games (alta) ----------------
  console:
    nome: Console
    detectar: [playstation 5, ps5, xbox series, nintendo switch, switch 2, switch oled, switch lite, steam deck, meta quest]
    excluir: [jogo, game para, capa, case, pelicula, controle, suporte, base, carregador, cabo, skin, headset, fone, joy-con]
    comparar: modelo
    reuso: modelo          # segunda opinião: mesmo modelo, qualquer marca de placa/vendedor
    specs: [capacidade]
    liquidez: alta
  controle:
    nome: Controle de videogame
    detectar: [dualsense, controle, joystick, gamepad]
    excluir: [controle remoto, capa, case, suporte, base, carregador para, grip, skin]
    comparar: modelo
    reuso: modelo          # segunda opinião: mesmo modelo, qualquer marca de placa/vendedor
    liquidez: alta

  # ---------------- Hardware de PC ----------------
  placa_de_video:
    nome: Placa de vídeo
    detectar: [placa de video, rtx, geforce, radeon, rx 9060, rx 9070, rx 7600, rx 7700, rx 7800, rx 6600, arc b580, arc a750]
    excluir: [notebook, laptop, suporte, riser, cabo, backplate, cooler para]
    comparar: modelo
    reuso: modelo          # segunda opinião: mesmo modelo, qualquer marca de placa/vendedor
    specs: [vram]
    liquidez: alta
  processador:
    nome: Processador
    detectar: [processador, ryzen, core i3, core i5, core i7, core i9, core ultra]
    excluir: [notebook, laptop, cooler, water cooler, placa-mae, placa mae, kit upgrade, computador, pc gamer, mini pc]
    comparar: modelo
    reuso: modelo          # segunda opinião: mesmo modelo, qualquer marca de placa/vendedor
    liquidez: alta
  placa_mae:
    nome: Placa-mãe
    detectar: [placa-mae, placa mae, motherboard]
    excluir: [kit upgrade, kit, processador, memoria ram]
    comparar: modelo
    liquidez: media
  ssd:
    nome: SSD
    detectar: [ssd]
    excluir: [case, gaveta, adaptador, dissipador, enclosure, hd externo, notebook, computador, pc gamer, console]
    comparar: especificacao
    specs: [interface_ssd, capacidade]
    busca: "SSD {interface_ssd} {capacidade}"
    liquidez: alta
    nota: Marca pouco importa para o comprador; o que define o preço é NVMe/SATA e capacidade.
  memoria_ram:
    nome: Memória RAM
    detectar: [memoria ram, memoria, ddr4, ddr5]
    excluir: [cartao de memoria, cartao, pendrive, ssd, notebook gamer, computador, pc gamer, placa de video, smartphone, celular, tablet]
    comparar: especificacao
    specs: [ddr, capacidade_ram, mhz, formato_ram]
    busca: "Memória {ddr} {capacidade_ram} {mhz}"
    liquidez: alta
  fonte_pc:
    nome: Fonte de PC
    detectar: [fonte]
    excluir: [fonte para notebook, carregador, fonte de alimentacao para, fonte bivolt para, fonte usb, power bank]
    comparar: especificacao
    specs: [watts, selo80plus]
    busca: "Fonte {marca} {watts} {selo80plus}"
    mesma_marca: true
    liquidez: media
    nota: Qualidade da fonte varia muito entre marcas; compara só dentro da mesma marca.
  monitor:
    nome: Monitor
    detectar: [monitor]
    excluir: [suporte, braco, monitor de pressao, babá, baba, monitor cardiaco, cabo]
    comparar: especificacao
    specs: [polegadas, resolucao, hz]
    busca: "Monitor {polegadas} {resolucao} {hz}"
    liquidez: alta
    nota: Monitor da mesma faixa de tamanho, resolução e taxa conta como equivalente.
  hd_externo:
    nome: HD / SSD externo
    detectar: [hd externo, ssd externo, ssd portatil, hd portatil]
    excluir: [case, gaveta, capa]
    comparar: especificacao
    specs: [capacidade]
    busca: "HD externo {capacidade}"
    liquidez: media
  pendrive:
    nome: Pendrive
    detectar: [pendrive, pen drive]
    comparar: especificacao
    specs: [capacidade]
    busca: "Pendrive {capacidade}"
    liquidez: baixa
  cartao_memoria:
    nome: Cartão de memória
    detectar: [cartao de memoria, microsd, micro sd, cartao sd]
    excluir: [leitor, adaptador]
    comparar: especificacao
